name: Website and bot checks
on:
  push:
    branches:
      - feat/website-requests-20261101
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/request-form.js
      - run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('web/index.html').read_text(encoding='utf-8')
          assert 'name="preferredDate"' in html
          assert 'name="preferredTime"' in html
          assert 'data:image/avif;base64,' in html
          assert '__PHOTO_BASE64__' not in html
          assert 'id="menuToggle"' in html
          assert html.index('<!-- HERO -->') < html.index('<!-- QUIZ -->')
          PY
